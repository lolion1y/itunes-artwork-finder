:root {
  color-scheme: light;
  --accent: #0D77FA;

@media(prefers-color-scheme: dark) {

    --page-text: #eee;

}

#themeToggle,

#themeToggle {

  margin-top: 0.75em;
  padding: 0.4em 0.6em;
  border: 1px solid var(--control-border);
  border-radius: 0.35em;
  font: inherit;
  cursor: pointer;

#themeToggle:hover, #themeToggle:focus-visible {

}

#searchForm {
  max-width: 50em;
  margin: 3em auto;
  padding: 0 3em;
}

#searchForm input {
  -webkit-appearance: none;
  outline: none;
  box-sizing: border-box;
  font-size: 18pt;
  margin: 0;
  padding: 0.5em;
  border: 2px solid var(--accent);
  font-weight: bold;
}

#searchForm input[name=term] {
  width: 80%;
  border-right: 0;
  border-radius: 0.5em 0 0 0.5em;
}

#searchForm input[type=submit] {
  width: 20%;
  border-left: 0;
  background: var(--accent);
  color: #fff;
  border-radius: 0 0.5em 0.5em 0;
}

#options {
  display: flex;
  margin-top: 3em;
  justify-content: flex-end;
  font-size: 10pt;
}

#options select {
  width: 20em;
  border-color: var(--control-border);
}

#results {
  margin: 3em;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
}

.result {
  flex-basis: 20%;
  box-sizing: border-box;
  padding: 1em;
  overflow: hidden;
}

@media(max-width: 1000px) {
  #searchForm {
    margin-top: 5em;
  }

  .result {
    flex-basis: 33.3%;
  }
}

@media(max-width: 600px) {
  .result {
    flex-basis: 100%;
  }
}

.result h2 {
  font-size: 10pt;
}

.result .artwork {
  position: relative;
  width: 100%;
  padding-bottom: 100%;
  background: var(--artwork-background);
}

.result .artwork img {
  display: block;
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
}

.result .links {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  visibility: hidden;
  font-size: 8pt;
}

.result:hover .links, .result:focus-within .links {
  visibility: visible;
}

.result .links a {
  display: block;
  float: left;
  padding: 0.5em;
  color: var(--resource-text);
  background: var(--resource-background);
  font-weight: bold;
  text-decoration: none;
}

.result .links a:hover {
  background: var(--resource-hover-background);
  color: var(--resource-hover-text);
}

#error, #progress {
  text-align: center;
  flex-basis: 100%;
  font-size: 24pt;
  font-weight: bold;
}

#progress {
  color: var(--progress);
}

    <script type="text/javascript">
'use strict'

const themeCookieName = 'preferred-theme'
const themeModes = ['auto', 'light', 'dark']
let preferredTheme = readPreferredTheme()

function readPreferredTheme() {
  const prefix = `${themeCookieName}=`
  const cookie = document.cookie.split(';').map(value => value.trim()).find(value => value.startsWith(prefix))
  const theme = cookie ? cookie.slice(prefix.length) : 'auto'
  return themeModes.includes(theme) ? theme : 'auto'
}

function applyTheme() {
  if (preferredTheme === 'auto') {
    document.documentElement.removeAttribute('data-theme')
  } else {
    document.documentElement.setAttribute('data-theme', preferredTheme)
  }
}

function updateThemeToggle() {
  const button = document.getElementById('themeToggle')
  if (!button) {
    return
  }

  const label = preferredTheme[0].toUpperCase() + preferredTheme.slice(1)
  button.textContent = `Theme: ${label}`
  button.setAttribute('aria-label', `Theme: ${label}. Activate to change theme.`)
}

function toggleTheme() {
  const nextTheme = themeModes[(themeModes.indexOf(preferredTheme) + 1) % themeModes.length]
  const secure = window.location.protocol === 'https:' ? '; Secure' : ''
  preferredTheme = nextTheme
  document.cookie = `${themeCookieName}=${preferredTheme}; Max-Age=31536000; Path=/; SameSite=Lax${secure}`
  applyTheme()
  updateThemeToggle()
}

applyTheme()

const entities = Object.freeze({
  tvSeason: "TV Show",
  movie: "Movie",
  ebook: "iBook",
  album: "Album",
  software: "App (iPhone or Universal)",
  iPadSoftware: "App (iPad)",
  macSoftware: "App (macOS)",
  audiobook: "Audiobook",
  podcast: "Podcast",
  musicVideo: "Music Video",
  id: "Movie ID",
  idAlbum: "Album ID",
  shortFilm: "Short Film"
})

function buildUrl(term, entity, country) {
  const urlSearchParams = new URLSearchParams()
  urlSearchParams.set('country', country)
  urlSearchParams.set('limit', 25)

  let baseUrl
  switch (entity) {
    case 'id':
    case 'idAlbum': {
      baseUrl = 'https://itunes.apple.com/lookup'
      urlSearchParams.set('id', term)
    } break
    default: {
      baseUrl = 'https://itunes.apple.com/search'
      urlSearchParams.set('term', term)
      if (entity == 'shortFilm') {
        urlSearchParams.set('entity', 'movie')
        urlSearchParams.set('attribute', 'shortFilmTerm')
      } else {
        urlSearchParams.set('entity', entity)
      }
    } break
  }

  return `${baseUrl}?${urlSearchParams}`
}

function buildArtwork(result, entity) {
  const artworkUrl100 = result['artworkUrl100'].replace(/^http:/, 'https:')
  const artwork = {
    title: entity === 'album' || entity === 'idAlbum' ? `${result['artistName']} - ${result['collectionName']}` : (result['collectionName'] || result['trackName']),
    urls: {},
    hires: null,
    uncompressed: null,
    width: 600,
    height: 600
  }

  for (const size of [300, 600, 1200, 5000]) {
    artwork.urls[size] = artworkUrl100.replace('100x100', `${size}x${size}`)
  }

  if (entity === 'album' || entity === 'idAlbum') {
    const parts = new URL(artworkUrl100).pathname.split('/image/thumb/')
    if (parts.length === 2) {
      const path = parts[1].split('/')
      path.pop()
      if (path.length > 0) {
        artwork.uncompressed = `https://a5.mzstatic.com/us/r1000/0/${path.join('/')}`
      }
    }
  }

  switch (entity) {
    case 'movie':
    case 'id':
    case 'shortFilm':
    case 'ebook': {
      artwork.width = 400
    } break
    case 'musicVideo': {
      artwork.width = 640
      artwork.height = 464
    } break
    case 'software':
    case 'iPadSoftware':
    case 'macSoftware': {
      artwork.width = 512
      artwork.height = 512
      if (result['artworkUrl512']) {
        artwork.hires = result['artworkUrl512'].replace(/^http:/, 'https:').replace('512x512bb', '1024x1024bb')
      }
    } break
  }

  return artwork
}

function escapeHtml(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
}

function buildSelectRow(id, label, options, selectedValue) {
  const optionHtml = Object.entries(options).map(([value, text]) =>
    `<option value="${escapeHtml(value)}"${value === selectedValue ? ' selected' : ''}>${escapeHtml(text)}</option>`
  ).join('')

  return `<tr>
    <td><label for="${escapeHtml(id)}">${escapeHtml(label)}</label></td>
    <td><select id="${escapeHtml(id)}" name="${escapeHtml(id)}">${optionHtml}</select></td>
  </tr>`
}

function buildErrorHtml(content) {
  return `<div id="error">${content}</div>`
}

async function fetchResults(term, entity, country) {
  const url = buildUrl(term, entity, country)
  const response = await fetch(url)
  if (!response.ok) {
    console.log(response)
    return null
  }
  return response.json()
}

async function onload() {
  const searchParams = new URLSearchParams(window.location.search)
  const term = searchParams.get('term')
  const country = searchParams.get('country') || 'us'
  const entity = searchParams.get('entity') || 'album'

  document.body.innerHTML = `
    <div id="corner">
      <a href="https://github.com/tzahola/itunes-artwork-finder" rel="noreferrer" referrerpolicy="no-referrer">Fork on GitHub</a><br/>
      <a href="Find%20iTunes%20Artwork.workflow.zip" rel="noreferrer" referrerpolicy="no-referrer">Integrate into macOS Automator</a>
      <button id="themeToggle" type="button" onclick="toggleTheme()"></button>
    </div>
    <form id="searchForm" method="GET">
    <div id="searchField">
      <h1>iTunes Artwork Finder</h1>
      <input type="text" name="term" value="${escapeHtml(term)}" placeholder="Enter search term here" /><input type="submit" value="Search" /></div>
    <div id="options">
      <table>
        ${buildSelectRow('country', 'iTunes Store Country:', countries, country)}
        ${buildSelectRow('entity', 'Media type:', entities, entity)}
      </table>
    </div>
  </form><div id="results"></div>`

  updateThemeToggle()

  if (term == null || term.length == 0) {
    return
  }

  const resultsDiv = document.getElementById('results')
  resultsDiv.innerHTML = `<div id="progress">Loading results...</div>`

  let error
  let results
  try {
    results = await fetchResults(term, entity, country)
    console.log(results)
  } catch(e) {
    error = e.message
    console.log(e)
  }

  if (results == null) {
    const errorDetails = error ? `<p>(${escapeHtml(error)})</p>` : ''
    resultsDiv.innerHTML = buildErrorHtml(`<p>Sorry, some error occurred while loading the results...</p>${errorDetails}`)
  } else {
    const resultItems = results["results"]
    if (resultItems === null || !Array.isArray(resultItems) || resultItems.length === 0) {
      resultsDiv.innerHTML = buildErrorHtml('Sorry, no results.')
    } else {
      resultsDiv.innerHTML = `${resultItems.map(result => {
        const artwork = buildArtwork(result, entity)
        const title = escapeHtml(artwork.title)
        const links = [600, 1200, 5000].map(size => ({ url: artwork.urls[size], title: size }))
        if (artwork.hires) {
          links.push({ url: artwork.hires, title: 'High Res' })
        }
        if (artwork.uncompressed) {
          links.push({ url: artwork.uncompressed, title: 'Orig' })
        }

        return `<div class="result">
          <div class="artwork">
            <img src="${escapeHtml(artwork.urls[300])}" alt="iTunes Artwork for '${title}'" width="${artwork.width}" height="${artwork.height}" />
            <div class="links">
              ${links.map(link => `<a href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" download="${title}">${link.title}</a>`).join('')}
            </div>
          </div>
          <h2>${title}</h2>
        </div>`
      }).join('')}`
    }
  }
}
    </script>
